services:
  db:
    image: postgres:16
    container_name: paraisocupcake_db
    # Los valores salen del .env de la raiz, el mismo que usa produccion.
    # Docker Compose sustituye ${...} leyendo ese archivo automaticamente.
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: paraisocupcake_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    # Misma configuracion que produccion...
    env_file:
      - .env
    # ...salvo lo que solo tiene sentido en local, que se sobreescribe aqui.
    # En Compose, "environment" tiene prioridad sobre "env_file".
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: paraisocupcake_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data: