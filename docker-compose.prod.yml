services:
  db:
    image: postgres:16
    container_name: paraisocupcake_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: paraisocupcakeshop-backend-prod
    container_name: paraisocupcake_backend_prod
    env_file:
      - .env
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: paraisocupcakeshop-frontend-prod
    container_name: paraisocupcake_frontend_prod
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/media:/var/www/media:ro
      - ./backend/staticfiles:/var/www/static:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      - backend
  certbot:
    image: certbot/certbot
    container_name: paraisocupcake_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Comprueba dos veces al dia si toca renovar. Let's Encrypt emite
    # certificados de 90 dias y los renueva cuando quedan menos de 30.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
volumes:
  postgres_data_prod:
  certbot_conf:
  certbot_www:
