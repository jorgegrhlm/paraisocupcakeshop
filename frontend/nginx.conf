# ---------------------------------------------------------------------------
# HTTP: solo sirve para dos cosas, la verificacion de Let's Encrypt y
# mandar a todo el mundo a HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name paraisocupcake.com www.paraisocupcake.com;

    # Esta ruta NO se redirige: es por donde Let's Encrypt comprueba el
    # dominio cada vez que renueva el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: el sitio de verdad.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name paraisocupcake.com www.paraisocupcake.com;

    ssl_certificate     /etc/letsencrypt/live/paraisocupcake.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paraisocupcake.com/privkey.pem;
    # Solo protocolos vigentes. TLS 1.0 y 1.1 estan obsoletos y son inseguros.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # Compresion: ahorra ancho de banda y acelera la carga, que en
    # conexiones moviles venezolanas se nota mucho.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite pone un hash en el nombre de cada archivo compilado, asi que
    # cambiar el contenido cambia el nombre: se pueden cachear un ano.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }
}